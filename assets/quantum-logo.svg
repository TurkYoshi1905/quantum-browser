<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <linearGradient id="ringA" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="ringB" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <radialGradient id="nucleus" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#a5f3fc"/>
      <stop offset="0.75" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0e7490"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#22d3ee" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="1024" rx="232" fill="url(#bg)"/>

  <!-- soft glow behind nucleus -->
  <circle cx="512" cy="512" r="330" fill="url(#glow)"/>

  <!-- orbit 1: teal, rotated -30° -->
  <g transform="rotate(-30 512 512)">
    <ellipse cx="512" cy="512" rx="330" ry="120" fill="none" stroke="url(#ringA)" stroke-width="44" stroke-linecap="round" opacity="0.95"/>
  </g>
  <!-- orbit 2: violet, rotated +55° -->
  <g transform="rotate(55 512 512)">
    <ellipse cx="512" cy="512" rx="330" ry="120" fill="none" stroke="url(#ringB)" stroke-width="44" stroke-linecap="round" opacity="0.95"/>
  </g>

  <!-- nucleus -->
  <circle cx="512" cy="512" r="96" fill="url(#nucleus)"/>
  <circle cx="512" cy="512" r="96" fill="none" stroke="#ecfeff" stroke-opacity="0.65" stroke-width="6"/>
</svg>
