name: Windows 64-bit Build

# QuantumBrowser — Windows x64 derleme hattı
# SAC açıkken bile (Windows runners'da derlenir) çalışır.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Encoding lint (mojibake)
        shell: bash
        run: |
          bad=$(grep -rn -E "Ã|â€" src/ src-tauri/src/ release-notes/ --include="*.tsx" --include="*.ts" --include="*.css" --include="*.html" --include="*.rs" --include="*.md" || true)
          if [ -n "$bad" ]; then
            echo "::error::Türkçe mojibake tespit edildi:"
            echo "$bad" | head -20
            exit 1
          fi
          echo "mojibake temiz"

      - name: Node 22 kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust kurulumu (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo önbellek
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Bağımlılıklar
        run: npm ci

      - name: Frontend üretimi (tsc + vite)
        run: npm run build

      - name: Tauri derlemesi (release NSIS .exe)
        id: tauri_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx tauri build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: SHA256 + release gövdesi hazırla
        if: always()
        shell: bash
        run: |
          exe=$(ls src-tauri/target/release/bundle/nsis/*.exe 2>/dev/null | head -n 1 || true)
          hash=""
          if [ -n "$exe" ]; then
            hash=$(sha256sum "$exe" | awk '{print $1}')
            sha256sum "$exe" > "$exe.sha256"
            echo "sha256=$hash" >> "$GITHUB_OUTPUT"
          fi
          {
            cat release-notes/0.0.2.md
            echo ""
            echo "## Bu derleme"
            echo "- Build: #${{ github.run_number }}"
            echo "- SHA256: \`$hash\`"
            echo "- Lisans: GNU AGPL-3.0"
          } > RELEASE_BODY.md

      - name: Derleme hatalarını annotations'a yaz
        if: steps.tauri_build.outcome == 'failure'
        shell: bash
        run: |
          echo "== Hata satırları =="
          grep -nE "^error" build.log | head -n 40
          echo "== Cargo özet (son 80 satır) =="
          tail -n 80 build.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1

      - name: Installer artefaktını kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuantumBrowser-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sha256
            src-tauri/target/release/*.exe
          if-no-files-found: warn

      - name: GitHub Release (main hattı)
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.0.2
          name: QuantumBrowser v0.0.2 (Windows x64)
          body_path: RELEASE_BODY.md
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false

