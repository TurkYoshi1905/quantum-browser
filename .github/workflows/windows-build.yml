name: Windows 64-bit Build

# QuantumBrowser — Windows x64 derleme hattı
# SAC açıkken bile (Windows runners'da derlenir) çalışır.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Node 22 kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust kurulumu (stable, x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo önbellek
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Bağımlılıklar
        run: npm ci

      - name: Frontend üretimi (tsc + vite)
        run: npm run build

      - name: Tauri derlemesi (release NSIS .exe)
        id: tauri_build
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx tauri build 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit $code

      - name: Derleme hatalarını annotations'a yaz
        if: steps.tauri_build.outcome == 'failure'
        shell: bash
        run: |
          echo "== Hata satırları =="
          grep -nE "^error" build.log | head -n 40
          echo "== Detay =="
          grep -nE "error\[|^error:" build.log | head -n 40 | while IFS= read -r line; do
            echo "::error::$line"
          done
          grep -A6 -E "error\[|^error:" build.log | head -n 120 | while IFS= read -r line; do
            echo "::error::$line"
          done
          exit 1

      - name: Installer artefaktını kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: QuantumBrowser-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/*.exe
          if-no-files-found: warn

      - name: GitHub Release (main hattı)
        if: github.ref == 'refs/heads/main' && success()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v0.1.0-build.${{ github.run_number }}
          name: QuantumBrowser v0.1.0 — build ${{ github.run_number }} (Windows x64)
          body: |
            ⚛️ **QuantumBrowser v0.1.0** — Tauri v2 + Rust + React ile inşa edildi.

            ⚠️ **İmzasız derleme.** Windows, "PC'niz korundu / Windows protected your PC" uyarısı gösterebilir.
            Bu, Microsoft'un bilinmeyen imzasız uygulamalar için standart uyarısıdır:
            **More info → Run anyway** ile çalıştırabilirsiniz.
            İmzalama (resmi sürüm) v1.0 hedefidir.

            Kurulum: `QuantumBrowser_0.1.0_x64-setup.exe` dosyasını çalıştırın.
            WebView2 Runtime gerektirir (Windows 10/11'de zaten yüklüdür; yüklü değilse kurulumcu indirir).

            Bilinen sınırlar: Chrome uzantıları yok (WebView2), bazı sitelerde Google OAuth 403 verebilir,
            DRM (Netflix) değişiklik gösterebilir.
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: false

